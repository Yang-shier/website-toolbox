            function findNext() {
                var query = document.getElementById('findInput').value;
                if (!query) return;
                var el = getActiveOutputEl();
                var count = 0;

                if (isPreviewMode()) {
                    // contenteditable div: use TreeWalker + Selection
                    var sel = window.getSelection();
                    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
                    var startNode = null,
                        startOffset = 0;
                    // If there's a current selection inside the preview, start after it
                    if (sel.rangeCount > 0 && el.contains(sel.anchorNode)) {
                        startNode = sel.anchorNode;
                        startOffset = sel.anchorOffset;
                    }
                    var found = false;
                    var firstMatch = null;
                    var node;
                    // First pass: count all matches
                    walker.currentNode = el;
                    while ((node = walker.nextNode())) {
                        var idx = node.textContent.indexOf(query);
                        while (idx !== -1) {
                            count++;
                            if (!firstMatch) firstMatch = { node: node, offset: idx };
                            idx = node.textContent.indexOf(query, idx + 1);
                        }
                    }
                    // Second pass: find match after current selection
                    walker.currentNode = el;
                    var pastCurrent = !startNode;
                    while ((node = walker.nextNode())) {
                        if (!pastCurrent) {
                            if (node === startNode) pastCurrent = true;
                            else continue;
                        }
                        var idx = node.textContent.indexOf(query);
                        while (idx !== -1) {
                            if (pastCurrent && (node !== startNode || idx >= startOffset)) {
                                var range = document.createRange();
                                range.setStart(node, idx);
                                range.setEnd(node, idx + query.length);
                                sel.removeAllRanges();
                                sel.addRange(range);
                                el.focus();
                                document.getElementById('findCount').textContent = '1 / ' + count;
                                found = true;
                                break;
                            }
                            idx = node.textContent.indexOf(query, idx + 1);
                        }
                        if (found) break;
                    }
                    // Wrap around
                    if (!found && firstMatch) {
                        var range = document.createRange();
                        range.setStart(firstMatch.node, firstMatch.offset);
                        range.setEnd(firstMatch.node, firstMatch.offset + query.length);
                        sel.removeAllRanges();
                        sel.addRange(range);
                        el.focus();
                        document.getElementById('findCount').textContent = '1 / ' + count;
                    }
                    if (count === 0) document.getElementById('findCount').textContent = '无匹配';
                } else {
                    // textarea mode
                    var text = el.value;
                    var searchStart = el.selectionEnd;
                    var idx = text.indexOf(query, searchStart);
                    if (idx === -1) idx = text.indexOf(query, 0); // wrap
                    if (idx !== -1) {
                        el.focus();
                        el.setSelectionRange(idx, idx + query.length);
                        // Count all
                        var c = 0,
                            pos = 0;
                        while ((pos = text.indexOf(query, pos)) !== -1) {
                            c++;
                            pos += query.length;
                        }
                        document.getElementById('findCount').textContent = '1 / ' + c;
                    } else {
                        document.getElementById('findCount').textContent = '无匹配';
                    }
                }
            }

            function replaceOne() {
                var query = document.getElementById('findInput').value;
                var repl = document.getElementById('replaceInput').value;
                if (!query) return;
                var el = getActiveOutputEl();

                if (isPreviewMode()) {
                    var sel = window.getSelection();
                    if (sel.rangeCount > 0 && sel.toString() === query) {
                        var range = sel.getRangeAt(0);
                        range.deleteContents();
                        range.insertNode(document.createTextNode(repl));
                        sel.collapseToEnd();
                    }
                    findNext();
                } else {
                    var text = el.value;
                    var start = el.selectionStart;
                    var end = el.selectionEnd;
                    if (text.substring(start, end) === query) {
                        el.value = text.substring(0, start) + repl + text.substring(end);
                        el.setSelectionRange(start + repl.length, start + repl.length);
                    }
                    findNext();
                }
            }

            function replaceAllMatches() {
                var query = document.getElementById('findInput').value;
                var repl = document.getElementById('replaceInput').value;
                if (!query) return;
                var el = getActiveOutputEl();

                if (isPreviewMode()) {
                    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
                    var nodes = [];
                    var node;
                    while ((node = walker.nextNode())) {
                        if (node.textContent.indexOf(query) !== -1) nodes.push(node);
                    }
                    var count = 0;
                    nodes.forEach(function (n) {
                        var text = n.textContent;
                        var idx;
                        while ((idx = text.indexOf(query)) !== -1) {
                            count++;
                            text = text.substring(0, idx) + repl + text.substring(idx + query.length);
                        }
                        n.textContent = text;
                    });
                    document.getElementById('findCount').textContent = count > 0 ? '已替换 ' + count + ' 处' : '无匹配';
                } else {
                    var text = el.value;
                    var count = 0;
                    while (text.indexOf(query) !== -1) {
                        count++;
                        text = text.replace(query, repl);
                    }
                    el.value = text;
                    document.getElementById('findCount').textContent = count > 0 ? '已替换 ' + count + ' 处' : '无匹配';
                }
                showToast('替换完成');
            }

            function getFormatInputHTML() {
                if (currentFormatInputTab === 'rich') {
                    return document.getElementById('richInput').innerHTML;
                }
                return document.getElementById('codeInput').value;
            }

            function formatAll() {
                var html = getFormatInputHTML();
                if (!html.trim()) {
                    showToast('请先输入内容', true);
                    return;
                }

                var optRemoveStyle = document.getElementById('optRemoveStyle').checked;
                var optAutoTitle = document.getElementById('optAutoTitle').checked;
                var optIndent = document.getElementById('optIndent').checked;
                var optKeepBold = document.getElementById('optKeepBold').checked;
                var optRemoveImg = document.getElementById('optRemoveImg').checked;

                var container = document.createElement('div');
                container.innerHTML = html;

                if (optRemoveImg) removeImages(container);
                normalizeBlockStructure(container);
                splitHeadingContent(container);
                cleanupStructure(container);
                flattenNestedParagraphs(container);
                convertHeadingsToParagraphs(container);

                if (!optKeepBold) removeBold(container);
                if (optRemoveStyle) removeInlineStyles(container);
                if (optAutoTitle) {
                    var titleRule = document.getElementById('titleDetectRule').value;
                    var titleOutputMode = document.getElementById('titleOutputMode').value;
                    autoDetectTitles(container, titleRule, titleOutputMode);
                }

                normalizeTextWhitespace(container);
                removeLeadingSpaces(container);
                cleanupImageParagraphWhitespace(container);
                removeEmptyParagraphs(container);
                if (optIndent) addParagraphIndent(container);
                centerImageParagraphs(container);

                var result = container.innerHTML;
                if (document.getElementById('optForbiddenWords').checked) {
                    result = applyForbiddenWords(result);
                }
                var preview = document.getElementById('fmtPreview');
                preview.innerHTML = result;

                if (lastImgWidth) {
                    preview.querySelectorAll('img').forEach(function (img) {
                        img.setAttribute('width', lastImgWidth);
                        img.removeAttribute('height');
                    });
                }

                document.getElementById('fmtOutputSource').value = formatHTMLSource(preview.innerHTML);
                showToast('格式化完成');
            }

            function splitHeadingContent(el) {
                el.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function (h) {
                    if (!h.querySelector('br')) return;
                    var segments = [];
                    var current = [];
                    Array.from(h.childNodes).forEach(function (node) {
                        if (node.nodeType === 1 && node.tagName && node.tagName.toLowerCase() === 'br') {
                            if (current.length > 0) {
                                segments.push(current);
                                current = [];
                            }
                        } else {
                            current.push(node);
                        }
                    });
                    if (current.length > 0) segments.push(current);
                    if (segments.length <= 1) return;
                    var parent = h.parentNode;
                    segments.forEach(function (nodes) {
                        var p = document.createElement('p');
                        nodes.forEach(function (n) {
                            p.appendChild(n);
                        });
                        if (!p.textContent.trim()) return;
                        parent.insertBefore(p, h);
                    });
                    parent.removeChild(h);
                });
            }

            function normalizeBlockStructure(el) {
                if (el.querySelector('p')) return;
                var topDivs = el.querySelectorAll('div, section');
                if (topDivs.length > 0) {
                    while (true) {
                        var targets = el.querySelectorAll('div, section');
                        var converted = false;
                        for (var i = targets.length - 1; i >= 0; i--) {
                            var div = targets[i];
                            if (div.querySelector('table, ul, ol, blockquote, p')) continue;
                            if (div.querySelector(':scope > div, :scope > section')) continue;
                            if (div.closest('p')) continue;
                            var p = document.createElement('p');
                            p.innerHTML = div.innerHTML;
                            div.parentNode.replaceChild(p, div);
                            converted = true;
                            break;
                        }
                        if (!converted) break;
                    }
                    el.querySelectorAll('div, section').forEach(function (div) {
                        if (div.closest('p')) return;
                        if (!div.textContent.trim() && !div.querySelector('img, table')) {
                            div.parentNode.removeChild(div);
                        }
                    });
                    return;
                }
                var html = el.innerHTML;
                if (!/<br[^>]*>\s*<br[^>]*>/i.test(html)) return;
                var segments = html.split(/<br[^>]*>\s*<br[^>]*>/gi);
                var result = '';
                segments.forEach(function (seg, idx) {
                    var text = seg.replace(/<br[^>]*>/gi, '').trim();
                    if (text) {
                        if (idx > 0) result += '<p><br></p>';
                        result += '<p>' + text + '</p>';
                    }
                });
                el.innerHTML = result;
            }

            function cleanupStructure(el) {
                el.innerHTML = el.innerHTML
                    .replace(/<\/?[a-z]+:[^>]*>/gi, '')
                    .replace(/<!--\[if[\s\S]*?endif\]-->/gi, '')
                    .replace(/<!--[\s\S]*?-->/g, '');

                el.innerHTML = el.innerHTML
                    .replace(/&nbsp;/gi, ' ')
                    .replace(/[\r\t]/g, '')
                    .replace(/ {2,}/g, ' ');

                el.querySelectorAll('p').forEach(function (p) {
                    if (!p.querySelector('br')) return;
                    var html = p.innerHTML;
                    var parts = html.split(/<br[^>]*>/gi);
                    if (parts.length <= 1) return;
                    var parent = p.parentNode;
                    parts.forEach(function (part) {
                        var text = part.replace(/<[^>]*>/g, '').trim();
                        if (!text) return;
                        var newP = document.createElement('p');
                        newP.innerHTML = part.trim();
                        parent.insertBefore(newP, p);
                    });
                    parent.removeChild(p);
                });
                el.querySelectorAll('br').forEach(function (br) {
                    br.parentNode.removeChild(br);
                });

                el.querySelectorAll('b').forEach(function (b) {
                    var strong = document.createElement('strong');
                    while (b.firstChild) strong.appendChild(b.firstChild);
                    b.parentNode.replaceChild(strong, b);
                });

                el.querySelectorAll('li').forEach(function (li) {
                    if (li.querySelector('p')) {
                        while (li.firstChild) li.parentNode.insertBefore(li.firstChild, li);
                        li.parentNode.removeChild(li);
                    } else {
                        var p = document.createElement('p');
                        p.innerHTML = li.innerHTML;
                        li.parentNode.replaceChild(p, li);
                    }
                });
                el.querySelectorAll('ul, ol').forEach(function (list) {
                    while (list.firstChild) list.parentNode.insertBefore(list.firstChild, list);
                    list.parentNode.removeChild(list);
                });
                el.querySelectorAll('a').forEach(function (a) {
                    var text = document.createTextNode(a.textContent);
                    a.parentNode.replaceChild(text, a);
                });

                var unwrapTags = [
                    'figure',
                    'figcaption',
                    'div',
                    'section',
                    'article',
                    'span',
                    'font',
                    'blockquote',
                    'pre',
                    'code',
                    'i',
                    'em',
                    'u',
                    's',
                    'strike',
                    'del',
                    'ins',
                    'sub',
                    'sup',
                    'mark',
                    'small',
                    'big',
                    'center',
                ];
                unwrapTags.forEach(function (tag) {
                    el.querySelectorAll(tag).forEach(function (node) {
                        while (node.firstChild) node.parentNode.insertBefore(node.firstChild, node);
                        node.parentNode.removeChild(node);
                    });
                });
            }

            function flattenNestedParagraphs(el) {
                el.querySelectorAll('p p').forEach(function (inner) {
                    var outer = inner.parentNode;
                    if (outer.tagName !== 'P') return;
                    outer.parentNode.insertBefore(inner, outer);
                });
                el.querySelectorAll('p').forEach(function (p) {
                    if (!p.textContent.trim() && !p.querySelector('img, table')) p.parentNode.removeChild(p);
                });
            }

            function normalizeTextWhitespace(el) {
                var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
                var nodes = [];
                var node;
                while ((node = walker.nextNode())) nodes.push(node);

                nodes.forEach(function (textNode) {
                    if (textNode.parentNode && textNode.parentNode.closest && textNode.parentNode.closest('table, td, th')) return;
                    var text = textNode.textContent
                        .replace(/[\u200b-\u200f\u202a-\u202e\u2060\ufeff]/g, '')
                        .replace(/[\u00a0\u1680\u180e\u2000-\u200a\u202f\u205f\u3000]/g, ' ')
                        .replace(/[\r\n\t\f\v]+/g, ' ')
                        .replace(/ {2,}/g, ' ');
                    text = removeCJKSpacing(text);
                    textNode.textContent = text;
                });

                normalizeInlineBoundarySpaces(el);
            }

            function isCJKChar(ch) {
                return /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/.test(ch || '');
            }

            function isCJKPunctuation(ch) {
                return /[，。！？；：、“”‘’（）《》【】〔〕·…—]/.test(ch || '');
            }

            function removeCJKSpacing(text) {
                return text
                    .replace(
                        /([\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]) +(?=[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff，。！？；：、“”‘’（）《》【】〔〕·…—])/g,
                        '$1'
                    )
                    .replace(/([，。！？；：、“”‘’（）《》【】〔〕·…—]) +(?=[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff])/g, '$1');
            }

            function getEdgeTextNode(node, fromEnd) {
                var current = node;
                while (current) {
                    if (current.nodeType === 3) return current;
                    if (current.nodeType !== 1) return null;
                    current = fromEnd ? current.lastChild : current.firstChild;
                }
                return null;
            }

            function normalizeInlineBoundarySpaces(el) {
                el.querySelectorAll('p, strong, b, a').forEach(function (parent) {
                    var children = Array.from(parent.childNodes);
                    for (var i = 0; i < children.length - 1; i++) {
                        var left = getEdgeTextNode(children[i], true);
                        var right = getEdgeTextNode(children[i + 1], false);
                        if (!left || !right) continue;
                        var leftText = left.textContent;
                        var rightText = right.textContent;
                        if (!leftText || !rightText) continue;
                        var leftTrimmed = leftText.replace(/ +$/, '');
                        var rightTrimmed = rightText.replace(/^ +/, '');
                        var leftChar = leftTrimmed.charAt(leftTrimmed.length - 1);
                        var rightChar = rightTrimmed.charAt(0);
                        if ((isCJKChar(leftChar) || isCJKPunctuation(leftChar)) && (isCJKChar(rightChar) || isCJKPunctuation(rightChar))) {
                            left.textContent = leftTrimmed;
                            right.textContent = rightText.replace(/^ +/, '');
                        }
                    }
                });
            }

            function stripLeadingInlineSpaces(node) {
                while (node.firstChild) {
                    var first = node.firstChild;
                    if (first.nodeType === 3) {
                        var cleaned = first.textContent.replace(/^[\s\u00a0\u3000]+/, '');
                        if (cleaned.length === 0) {
                            node.removeChild(first);
                            continue;
                        }
                        first.textContent = cleaned;
                        return;
                    }
                    if (first.nodeType !== 1) return;
                    var tag = first.tagName.toLowerCase();
                    if (['strong', 'b', 'span', 'font', 'i', 'em', 'u', 's', 'small', 'big', 'a'].indexOf(tag) === -1) return;
                    stripLeadingInlineSpaces(first);
                    if (!first.textContent.trim() && !first.querySelector('img, table')) {
                        node.removeChild(first);
                        continue;
                    }
                    return;
                }
            }

            function removeLeadingSpaces(el) {
                el.querySelectorAll('p').forEach(function (p) {
                    if (p.closest('table, td, th')) return;
                    stripLeadingInlineSpaces(p);
                });
            }

            function cleanupImageParagraphWhitespace(el) {
                el.querySelectorAll('p').forEach(function (p) {
                    if (!p.querySelector('img')) return;
                    Array.from(p.childNodes).forEach(function (node) {
                        if (node.nodeType === 3 && !node.textContent.replace(/[\s\u00a0\u3000]/g, '')) {
                            p.removeChild(node);
                        }
                    });
                });
            }

            function removeEmptyParagraphs(el) {
                el.querySelectorAll('p').forEach(function (p) {
                    var text = p.textContent.replace(/[\s\u00a0\u3000]/g, '');
                    if (!text && !p.querySelector('img, table')) p.parentNode.removeChild(p);
                });
            }

            function removeImages(el) {
                el.querySelectorAll('img').forEach(function (img) {
                    img.parentNode.removeChild(img);
                });
            }

            function convertHeadingsToParagraphs(el) {
                el.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function (h) {
                    var p = document.createElement('p');
                    var strong = document.createElement('strong');
                    while (h.firstChild) strong.appendChild(h.firstChild);
                    p.appendChild(strong);
                    h.parentNode.replaceChild(p, h);
                });
            }

            function removeInlineStyles(el) {
                el.querySelectorAll('*').forEach(function (node) {
                    var tag = node.tagName.toLowerCase();
                    var attrs = Array.from(node.attributes);
                    attrs.forEach(function (attr) {
                        if (tag === 'img' && ['src', 'alt', 'width', 'height'].indexOf(attr.name) !== -1) return;
                        if ((tag === 'td' || tag === 'th') && ['colspan', 'rowspan'].indexOf(attr.name) !== -1) return;
                        node.removeAttribute(attr.name);
                    });
                });
            }

            function removeBold(el) {
                el.querySelectorAll('b, strong').forEach(function (node) {
                    while (node.firstChild) node.parentNode.insertBefore(node.firstChild, node);
                    node.parentNode.removeChild(node);
                });
            }

            function autoDetectTitles(el, titleRule, titleOutputMode) {
                var blocks = el.querySelectorAll('p, div');
                var endPunctuation = /[。，！？；、,.!?;:]$/;
                var cjkRe = /[一-鿿㐀-䶿]/;
                var bulletRe = /^[\s　]*(●|·|•|◆|■|▪|★|※|►|▶|➤|○|◇|□|△|▷|⊙|⊕|→|»|›|[-*·‣⁃])\s*/;
                var indentRe = /^[　 \t]{2,}/;

                blocks.forEach(function (block) {
                    var rawText = block.textContent;
                    var text = rawText.trim();
                    if (!isTitleCandidateBlock(block, rawText, text, bulletRe, indentRe)) return;
                    if (scoreTitleCandidate(block, text, titleRule, endPunctuation, cjkRe) < 5) return;

                    var children = block.childNodes;
                    var onlyInline = true;
                    for (var i = 0; i < children.length; i++) {
                        var c = children[i];
                        if (c.nodeType === 1) {
                            var tag = c.tagName.toLowerCase();
                            if (['div', 'p', 'table', 'ul', 'ol', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6'].indexOf(tag) !== -1) {
                                onlyInline = false;
                                break;
                            }
                        }
                    }
                    if (!onlyInline) return;

                    if (titleOutputMode === 'h3') {
                        var h3 = document.createElement('h3');
                        while (block.firstChild) h3.appendChild(block.firstChild);
                        block.parentNode.replaceChild(h3, block);
                        return;
                    }

                    var strong = document.createElement('strong');
                    while (block.firstChild) strong.appendChild(block.firstChild);
                    block.appendChild(strong);
                });
            }

            function isTitleCandidateBlock(block, rawText, text, bulletRe, indentRe) {
                if (block.closest('table, td, th')) return false;
                if (block.querySelector('p, div, table, ul, ol')) return false;
                if (block.querySelector('strong, b')) return false;
                if (!text) return false;
                if (text.length < 2) return false;
                if (bulletRe.test(text)) return false;
                if (indentRe.test(rawText)) return false;
                if (/[。！？!?]$/.test(text)) return false;
                if (/^(https?:\/\/|www\.)/i.test(text)) return false;
                return true;
            }

            function scoreTitleCandidate(block, text, titleRule, endPunctuation, cjkRe) {
                var score = 0;
                var isCJK = cjkRe.test(text);
                var normalized = text.replace(/\s+/g, ' ');
                var wordCount = normalized.split(' ').filter(Boolean).length;
                var nextText = getNeighborBlockText(block, 1);
                var prevText = getNeighborBlockText(block, -1);
                var hasTitlePattern = /^(第?[一二三四五六七八九十\d]+[、.．)]|[（(]?[一二三四五六七八九十\d]+[）)]|[A-Z]?\d{1,2}[.．]\s*)/.test(text);
                var hasEnglishTitleWords = /\b(features?|advantages?|benefits?|applications?|specifications?|parameters?|details?|overview|installation|usage|maintenance|faq|why choose|about us|product|service|solution|case|packing|shipping|payment|warranty)\b/i.test(text);
                var hasCjkTitleWords = /(特点|优势|功能|参数|规格|应用|用途|详情|介绍|说明|步骤|流程|服务|案例|包装|运输|付款|质保|售后|常见问题|为什么选择)/.test(text);
                var commaCount = (text.match(/[，,、]/g) || []).length;

                if (isCJK) {
                    if (text.length <= 12) score += 3;
                    else if (text.length <= 20) score += 2;
                    else if (text.length <= 26) score += 1;
                    else score -= 4;
                } else {
                    if (wordCount <= 5) score += 3;
                    else if (wordCount <= 9) score += 2;
                    else if (wordCount <= 12) score += 1;
                    else score -= 4;
                    if (text.length > 90) score -= 3;
                }

                if (!endPunctuation.test(text)) score += 2;
                else score -= 3;

                if (hasTitlePattern) score += 3;
                if (hasEnglishTitleWords || hasCjkTitleWords) score += 3;
                if (nextText && nextText.length >= text.length * 1.8) score += 2;
                if (prevText && prevText.length >= text.length * 1.8) score += 1;
                if (titleRule === 'english' && !isCJK && /^[A-Z0-9][A-Za-z0-9 &+/\-()]+$/.test(text)) score += 1;

                if (commaCount >= 2) score -= 2;
                if (/^(因为|所以|但是|如果|同时|另外|我们|这|该|其|The|This|It|We|Our)\b/i.test(text)) score -= 2;
                if (titleRule !== 'english' && !isCJK && wordCount > 10) score -= 2;
                if (titleRule === 'english' && isCJK && text.length > 20) score -= 3;

                return score;
            }

            function getNeighborBlockText(block, direction) {
                var node = direction > 0 ? block.nextElementSibling : block.previousElementSibling;
                while (node) {
                    var tag = node.tagName ? node.tagName.toLowerCase() : '';
                    if (['p', 'div', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6'].indexOf(tag) !== -1) {
                        var text = node.textContent.trim();
                        if (text) return text;
                    }
                    node = direction > 0 ? node.nextElementSibling : node.previousElementSibling;
                }
                return '';
            }

            function addParagraphIndent(el) {
                el.querySelectorAll('p').forEach(function (p) {
                    if (p.closest('table, td, th')) return;
                    if (!p.textContent.trim()) return;
                    p.style.textIndent = '2em';
                });
            }

            function centerImageParagraphs(el) {
                el.querySelectorAll('p').forEach(function (p) {
                    if (p.querySelector('img')) {
                        p.style.textAlign = 'center';
                        p.style.textIndent = '0';
                    }
                });
            }

            function formatHTMLSource(html) {
                return html
                    .replace(/>\s+</g, '><')
                    .replace(/(<\/(?:p|div|table|tbody|thead|tr|td|th|ul|ol|li|h[1-6])>)/gi, '$1\n')
                    .replace(/(<(?:p|div|table|tbody|thead|tr|td|th|ul|ol|li|h[1-6])[\s>])/gi, '\n$1')
                    .replace(/^\n+/, '')
                    .replace(/\n{3,}/g, '\n\n');
            }

            function copyFormatResult() {
                var preview = document.getElementById('fmtPreview');
                if (!preview.innerHTML.trim()) {
                    showToast('没有可复制的内容', true);
                    return;
                }

                if (currentFormatOutputTab === 'source') {
                    var source = document.getElementById('fmtOutputSource').value;
                    navigator.clipboard.writeText(source).then(function () {
                        showToast('源代码已复制');
                    });
                } else {
                    var cleanHTML = preview.innerHTML;
                    var blob = new Blob([cleanHTML], { type: 'text/html' });
                    var textBlob = new Blob([preview.textContent], { type: 'text/plain' });
                    navigator.clipboard.write([new ClipboardItem({ 'text/html': blob, 'text/plain': textBlob })]).then(function () {
                        showToast('已复制纯净富文本');
                    });
                }
            }

            function clearFormat() {
                document.getElementById('richInput').innerHTML = '';
                document.getElementById('codeInput').value = '';
                document.getElementById('fmtPreview').innerHTML = '';
                document.getElementById('fmtOutputSource').value = '';
                showToast('已清除');
            }

            function showImgWidthDialog() {
                document.getElementById('imgWidthModal').classList.add('show');
                document.getElementById('imgWidthInput').value = lastImgWidth;
                document.getElementById('imgWidthInput').focus();
            }

            function closeImgWidthDialog() {
                document.getElementById('imgWidthModal').classList.remove('show');
            }

            function setPreset(val) {
                document.getElementById('imgWidthInput').value = val;
            }

            function applyImgWidth() {
                var val = document.getElementById('imgWidthInput').value.trim();
                if (!val) {
                    showToast('请输入宽度值', true);
                    return;
                }

                lastImgWidth = val;
                updateImgWidthBtn();

                var preview = document.getElementById('fmtPreview');
                if (preview.innerHTML.trim()) {
                    var imgs = preview.querySelectorAll('img');
                    imgs.forEach(function (img) {
                        img.setAttribute('width', val);
                        img.removeAttribute('height');
                    });
                    document.getElementById('fmtOutputSource').value = formatHTMLSource(preview.innerHTML);
                    showToast('已设置图片宽度 ' + val + (imgs.length ? '，已应用到 ' + imgs.length + ' 张图片' : ''));
                } else {
                    showToast('图片宽度已设为 ' + val + '，格式化时自动应用');
                }
                closeImgWidthDialog();
            }

            function resetImgWidth() {
                lastImgWidth = '';
                updateImgWidthBtn();
                var preview = document.getElementById('fmtPreview');
                if (preview.innerHTML.trim()) {
                    preview.querySelectorAll('img').forEach(function (img) {
                        img.removeAttribute('width');
                    });
                    document.getElementById('fmtOutputSource').value = formatHTMLSource(preview.innerHTML);
                }
                closeImgWidthDialog();
                showToast('图片宽度已重置');
            }

            function updateImgWidthBtn() {
                document.getElementById('imgWidthBtnText').textContent = lastImgWidth ? '图片宽度：' + lastImgWidth : '图片宽度：未设置';
            }

            // 输出区粘贴/编辑时自动给新图片加宽度
            document.getElementById('fmtPreview').addEventListener('input', function () {
                if (!lastImgWidth) return;
                this.querySelectorAll('img:not([width])').forEach(function (img) {
                    img.setAttribute('width', lastImgWidth);
                    img.removeAttribute('height');
                });
            });

            // 源导航代码粘贴后自动提取
            document.getElementById('sourceInput').addEventListener('input', function () {
                if (this.value.trim()) extractNav();
            });

            // 联系人信息粘贴后自动提取
            document.getElementById('contactInput').addEventListener('input', function () {
                if (this.value.trim()) extractContact();
            });

            // === Text Processing Feature ===

            var CN_PUNCT = '，。！？、；：“”‘’【】（）《》—…·';
            var EN_PUNCT = ',.!?;:\'""[]()<>—...*';

            function fmtTabClick(el, type) {
                var siblings = el.parentNode.querySelectorAll('.fmt-tab');
                for (var i = 0; i < siblings.length; i++) siblings[i].classList.remove('active');
                el.classList.add('active');
                processText(type);
            }

            function runTextprocTool(btn, type) {
                var ok = processText(type);
                if (!ok) return;
                document.querySelectorAll('#textprocPage .textproc-tool-btn').forEach(function (item) {
                    item.classList.remove('active');
                });
                if (btn) btn.classList.add('active');
            }

            function processText(type) {
                var input = document.getElementById('textprocInput').value;
                if (!input) {
                    showToast('请先输入文本', true);
                    return false;
                }

                var result = input;

                switch (type) {
                    case 'upper':
                        result = input.toUpperCase();
                        break;
                    case 'lower':
                        result = input.toLowerCase();
                        break;
                    case 'capitalize':
                        result = input.toLowerCase().replace(/(^|[\s。！？；.!?;]+)(\S)/g, function (m, sep, ch) {
                            return sep + ch.toUpperCase();
                        });
                        break;
                    case 'trimSpaces':
                        result = input
                            .split(/\r?\n/)
                            .map(function (line) {
                                return line.trim();
                            })
                            .join('\n');
                        break;
                    case 'collapseSpaces':
                        result = input.replace(/[\t\u00a0\u3000 ]+/g, ' ');
                        break;
                    case 'removeSpaces':
                        result = input.replace(/[\t\u00a0\u3000 ]+/g, '');
                        break;
                    case 'cn2en':
                        for (var i = 0; i < CN_PUNCT.length; i++) {
                            result = result.split(CN_PUNCT[i]).join(EN_PUNCT[i] || '');
                        }
                        break;
                    case 'en2cn':
                        for (var i = 0; i < EN_PUNCT.length; i++) {
                            if (EN_PUNCT[i]) result = result.split(EN_PUNCT[i]).join(CN_PUNCT[i] || '');
                        }
                        break;
                    case 'trimEmpty':
                        result = input.replace(/\n[ \t]*\n/g, '\n');
                        break;
                    case 'removeBreaks':
                        result = input.replace(/[\r\n]+/g, '');
                        break;
                    case 'keepSingleBreak':
                        result = input.replace(/\n{2,}/g, '\n').replace(/\r{2,}/g, '\r');
                        break;
                    case 'lineUnique':
                        var seen = {};
                        result = input
                            .split(/\r?\n/)
                            .filter(function (line) {
                                var key = line.trim();
                                if (!key) return false;
                                if (seen[key]) return false;
                                seen[key] = true;
                                return true;
                            })
                            .join('\n');
                        break;
                    case 'lineSort':
                        result = input
                            .split(/\r?\n/)
                            .filter(function (line) {
                                return line.trim();
                            })
                            .sort(function (a, b) {
                                return a.localeCompare(b, 'zh-CN');
                            })
                            .join('\n');
                        break;
                    case 'lineNumber':
                        result = input
                            .split(/\r?\n/)
                            .filter(function (line) {
                                return line.trim();
                            })
                            .map(function (line, idx) {
                                return idx + 1 + '. ' + line.trim();
                            })
                            .join('\n');
                        break;
                }

                document.getElementById('textprocOutput').value = result;
                updateTextprocStats();
                showToast('处理完成');
                return true;
            }

            function getTextprocStats(text) {
                var chars = text.length;
                var lines = text ? text.split(/\r?\n/).length : 0;
                return { chars: chars, lines: lines };
            }

            function renderTextprocStats(id, text) {
                var el = document.getElementById(id);
                if (!el) return;
                var stat = getTextprocStats(text);
                el.innerHTML = '<span>' + stat.chars + ' 字</span><span>' + stat.lines + ' 行</span>';
            }

            function updateTextprocStats() {
                renderTextprocStats('textprocInputStats', document.getElementById('textprocInput').value);
                renderTextprocStats('textprocOutputStats', document.getElementById('textprocOutput').value);
            }

            function useTextprocOutputAsInput() {
                var output = document.getElementById('textprocOutput').value;
                if (!output) {
                    showToast('没有可回填的结果', true);
                    return;
                }
                document.getElementById('textprocInput').value = output;
                document.getElementById('textprocOutput').value = '';
                updateTextprocStats();
                showToast('结果已回填到源文本');
            }

            function copyTextprocOutput() {
                var output = document.getElementById('textprocOutput').value;
                if (!output) {
                    showToast('没有可复制的内容', true);
                    return;
                }
                navigator.clipboard.writeText(output).then(function () {
                    showToast('已复制到剪贴板');
                });
            }

            function clearTextproc() {
                document.getElementById('textprocInput').value = '';
                document.getElementById('textprocOutput').value = '';
                document.querySelectorAll('#textprocPage .textproc-tool-btn').forEach(function (item) {
                    item.classList.remove('active');
                });
                updateTextprocStats();
                showToast('已清除');
            }

            // === Forbidden Words Feature ===

            var DEFAULT_FORBIDDEN_WORDS_URL = './forbidden-words.json';
            var forbiddenWords = [];

            function normalizeForbiddenWord(item) {
                if (!item || item.word === undefined || item.word === null) return null;
                var word = String(item.word).trim();
                if (!word) return null;
                var replacement =
                    item.replacement === undefined || item.replacement === null
                        ? ''
                        : String(item.replacement).trim();
                return { word: word, replacement: replacement };
            }

            function appendForbiddenWord(item, dedupeByWord) {
                var normalized = normalizeForbiddenWord(item);
                if (!normalized) return false;
                var exists = forbiddenWords.some(function (existing) {
                    return dedupeByWord
                        ? existing.word === normalized.word
                        : existing.word === normalized.word && existing.replacement === normalized.replacement;
                });
                if (exists) return false;
                forbiddenWords.push(normalized);
                return true;
            }

            function loadForbiddenWords() {
                try {
                    var saved = localStorage.getItem('fw_forbidden_words');
                    if (saved) {
                        var parsed = JSON.parse(saved);
                        if (Array.isArray(parsed)) {
                            forbiddenWords = [];
                            parsed.forEach(function (item) {
                                appendForbiddenWord(item, false);
                            });
                        }
                    }
                } catch (e) {
                    forbiddenWords = [];
                }
                updateFwBadge();
            }

            function loadDefaultForbiddenWords() {
                if (typeof fetch !== 'function') return;
                fetch(DEFAULT_FORBIDDEN_WORDS_URL, { cache: 'no-store' })
                    .then(function (response) {
                        if (!response.ok) throw new Error('Default forbidden words not available');
                        return response.json();
                    })
                    .then(function (items) {
                        if (!Array.isArray(items)) return;
                        var added = 0;
                        items.forEach(function (item) {
                            if (appendForbiddenWord(item, true)) added++;
                        });
                        if (added > 0) {
                            saveForbiddenWords();
                            renderForbiddenWordList();
                        }
                    })
                    .catch(function () {
                        // Defaults are optional so local/file usage still works.
                    });
            }

            function saveForbiddenWords() {
                localStorage.setItem('fw_forbidden_words', JSON.stringify(forbiddenWords));
                updateFwBadge();
            }

            function updateFwBadge() {
                var badge = document.getElementById('fwBadge');
                if (forbiddenWords.length > 0) {
                    badge.textContent = forbiddenWords.length;
                    badge.style.display = '';
                } else {
                    badge.style.display = 'none';
                }
            }

            function showForbiddenWordsModal() {
                renderForbiddenWordList();
                document.getElementById('forbiddenWordsModal').classList.add('show');
                document.getElementById('fwWordInput').value = '';
                document.getElementById('fwReplacementInput').value = '';
                document.getElementById('fwWordInput').focus();
            }

            function closeForbiddenWordsModal() {
                document.getElementById('forbiddenWordsModal').classList.remove('show');
            }

            function addForbiddenWord() {
                var word = document.getElementById('fwWordInput').value.trim();
                var replacement = document.getElementById('fwReplacementInput').value.trim();
                if (!word) {
                    showToast('请输入禁词', true);
                    return;
                }

                appendForbiddenWord({ word: word, replacement: replacement }, false);
                saveForbiddenWords();
                renderForbiddenWordList();
                document.getElementById('fwWordInput').value = '';
                document.getElementById('fwReplacementInput').value = '';
                document.getElementById('fwWordInput').focus();
                showToast('已添加禁词：' + word);
            }

            function removeForbiddenWord(idx) {
                forbiddenWords.splice(idx, 1);
                saveForbiddenWords();
                renderForbiddenWordList();
            }

            function clearAllForbiddenWords() {
                if (forbiddenWords.length === 0) return;
                if (!confirm('确定清空全部禁词？')) return;
                forbiddenWords = [];
                saveForbiddenWords();
                renderForbiddenWordList();
                showToast('已清空禁词库');
            }

            function renderForbiddenWordList() {
                var container = document.getElementById('fwList');
                if (forbiddenWords.length === 0) {
                    container.innerHTML = '<div class="fw-empty">暂无禁词，请在上方添加</div>';
                    return;
                }
                var html =
                    '<table><thead><tr><th style="width:35%;">禁词</th><th style="width:35%;">替换为</th><th style="width:10%;"></th></tr></thead><tbody>';
                forbiddenWords.forEach(function (item, idx) {
                    html +=
                        '<tr><td class="fw-word">' +
                        esc(item.word) +
                        '</td><td class="fw-replacement">' +
                        esc(item.replacement) +
                        '</td>' +
                        '<td><button class="fw-del" onclick="removeForbiddenWord(' +
                        idx +
                        ')" title="删除">×</button></td></tr>';
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            }

            function applyForbiddenWords(text) {
                if (forbiddenWords.length === 0) return text;
                forbiddenWords.forEach(function (item) {
                    if (text.indexOf(item.word) !== -1) {
                        text = text.split(item.word).join(item.replacement);
                    }
                });
                return text;
            }

            // 禁词输入框回车添加
            document.getElementById('fwWordInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') document.getElementById('fwReplacementInput').focus();
            });
            document.getElementById('fwReplacementInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') addForbiddenWord();
            });

            // 初始化加载禁词库
            loadForbiddenWords();
            loadDefaultForbiddenWords();

            // === Forbidden Words Import/Export ===

            function exportForbiddenWords() {
                if (forbiddenWords.length === 0) {
                    showToast('禁词库为空', true);
                    return;
                }
                var lines = forbiddenWords.map(function (item) {
                    return item.word + '=' + item.replacement;
                });
                var text = lines.join('\n');
                var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = '禁词库.txt';
                a.click();
                URL.revokeObjectURL(url);
                showToast('已导出 ' + forbiddenWords.length + ' 条禁词');
            }

            function importForbiddenWords(event) {
                var file = event.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function (e) {
                    var content = e.target.result;
                    var count = 0;

                    if (file.name.endsWith('.json')) {
                        try {
                            var arr = JSON.parse(content);
                            if (Array.isArray(arr)) {
                                arr.forEach(function (item) {
                                    if (item.word && item.replacement !== undefined) {
                                        if (appendForbiddenWord(item, false)) count++;
                                    }
                                });
                            }
                        } catch (err) {
                            showToast('JSON 解析失败', true);
                            return;
                        }
                    } else {
                        // txt/csv: 每行一条，支持 = , \t 分隔
                        var lines = content.split(/\r?\n/);
                        lines.forEach(function (line) {
                            line = line.trim();
                            if (!line) return;
                            var parts = line.replace(/\uFF0C/g, ',').split(/[=\t,]/);
                            if (parts.length >= 2) {
                                var word = parts[0].trim();
                                var replacement = parts[1].trim();
                                if (appendForbiddenWord({ word: word, replacement: replacement }, false)) count++;
                            }
                        });
                    }

                    if (count > 0) {
                        saveForbiddenWords();
                        renderForbiddenWordList();
                        showToast('已导入 ' + count + ' 条禁词');
                    } else {
                        showToast('未解析到有效禁词', true);
                    }
                };
                reader.readAsText(file, 'UTF-8');
                event.target.value = '';
            }

            function showFbBatchInput() {
                document.getElementById('fwBatchModal').classList.add('show');
                document.getElementById('fwBatchInput').value = '';
                document.getElementById('fwBatchInput').focus();
            }

            function closeFbBatchModal() {
                document.getElementById('fwBatchModal').classList.remove('show');
            }

            function confirmBatchImport() {
                var text = document.getElementById('fwBatchInput').value.trim();
                if (!text) {
                    showToast('请输入禁词内容', true);
                    return;
                }

                var count = 0;
                var lines = text.split(/\r?\n/);
                lines.forEach(function (line) {
                    line = line.trim();
                    if (!line) return;
                    var parts = line.replace(/\uFF0C/g, ',').split(/[=\t,]/);
                    if (parts.length >= 2) {
                        var word = parts[0].trim();
                        var replacement = parts[1].trim();
                        if (appendForbiddenWord({ word: word, replacement: replacement }, false)) count++;
                    }
                });

                if (count > 0) {
                    saveForbiddenWords();
                    renderForbiddenWordList();
                    closeFbBatchModal();
                    showToast('已批量添加 ' + count + ' 条禁词');
                } else {
                    showToast('未解析到有效禁词，请检查格式', true);
                }
            }

            // 拦截输出区 Ctrl+C，写入纯净 HTML
            document.getElementById('fmtPreview').addEventListener('copy', function (e) {
                var sel = window.getSelection();
                if (!sel.rangeCount) return;
                var range = sel.getRangeAt(0);
                var frag = range.cloneContents();
                var tmp = document.createElement('div');
                tmp.appendChild(frag);
                e.clipboardData.setData('text/html', tmp.innerHTML);
                e.clipboardData.setData('text/plain', tmp.textContent);
                e.preventDefault();
            });
        </script>
    </body>
</html>
