<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>建站工具箱</title>
        <style>
            :root {
                --bg-primary: #f5f7fa;
                --bg-secondary: #ffffff;
                --bg-card: rgba(0, 0, 0, 0.03);
                --border: rgba(0, 0, 0, 0.08);
                --text: #1a1a2e;
                --text-dim: #888;
                --accent: #6c63ff;
                --accent-hover: #7b73ff;
                --accent-glow: rgba(108, 99, 255, 0.25);
                --success: #4caf50;
                --danger: #e74c3c;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(135deg, var(--bg-primary) 0%, #eef1f5 50%, var(--bg-primary) 100%);
                color: var(--text);
                height: 100vh;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            /* ── Header ── */
            .header {
                padding: 10px 24px;
                display: flex;
                align-items: center;
                gap: 20px;
                border-bottom: 1px solid var(--border);
                backdrop-filter: blur(20px);
                background: rgba(255, 255, 255, 0.85);
                flex-shrink: 0;
            }
            .header h1 {
                font-size: 18px;
                font-weight: 600;
                background: linear-gradient(135deg, #6c63ff, #48c6ef);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                letter-spacing: 1px;
                white-space: nowrap;
            }
            .tab-group {
                display: flex;
                gap: 4px;
                background: var(--bg-card);
                border-radius: 8px;
                padding: 3px;
            }
            .tab-btn {
                padding: 5px 16px;
                border: none;
                border-radius: 6px;
                font-size: 15px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s;
                background: transparent;
                color: var(--text-dim);
            }
            .tab-btn.active {
                background: linear-gradient(135deg, var(--accent), #48c6ef);
                color: #fff;
                box-shadow: 0 2px 10px var(--accent-glow);
            }
            .tab-btn:not(.active):hover {
                background: rgba(0, 0, 0, 0.05);
            }

            /* ── Main layout ── */
            .main {
                display: none;
                flex: 1;
                min-height: 0;
            }
            .main.active {
                display: flex;
            }

            /* ── Sidebar ── */
            .sidebar {
                width: 380px;
                flex-shrink: 0;
                overflow-y: auto;
                border-right: 1px solid var(--border);
                background: var(--bg-secondary);
            }
            .section {
                border-bottom: 1px solid var(--border);
            }
            .section:last-child {
                border-bottom: none;
            }
            .section-header {
                padding: 10px 16px;
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 2px;
                color: var(--text-dim);
                background: rgba(0, 0, 0, 0.02);
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                user-select: none;
                transition: background 0.15s;
            }
            .section-header:hover {
                background: rgba(0, 0, 0, 0.04);
            }
            .section-arrow {
                font-size: 10px;
                transition: transform 0.2s;
                display: inline-block;
                color: #bbb;
            }
            .section.collapsed .section-arrow {
                transform: rotate(-90deg);
            }
            .section.collapsed .section-body {
                display: none;
            }
            .section-header .badge {
                font-size: 11px;
                padding: 2px 8px;
                border-radius: 10px;
                background: var(--accent);
                color: #fff;
                letter-spacing: 0;
                text-transform: none;
                font-weight: 500;
                margin-left: auto;
            }
            .section-body {
                padding: 12px 16px;
            }
            .section-body--flush {
                padding: 0;
            }
            .section-body textarea {
                width: 100%;
                height: 150px;
                padding: 10px 12px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: #f0f1f3;
                color: var(--text);
                font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
                font-size: 12px;
                line-height: 1.6;
                resize: vertical;
                outline: none;
                display: block;
            }
            .section-body textarea:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-glow);
            }
            .section-body textarea::placeholder {
                color: rgba(0, 0, 0, 0.25);
            }
            .section-action {
                margin-top: 10px;
            }

            /* ── Nav tree ── */
            .nav-tree {
                padding: 12px 16px;
                flex: 1;
                overflow-y: auto;
            }
            .nav-tree:empty::before {
                content: '\2190  在左侧粘贴源导航代码，然后点击「提取导航」';
                color: rgba(0, 0, 0, 0.25);
                font-size: 13px;
            }
            .nav-item {
                margin-bottom: 8px;
            }
            .nav-item-header {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 10px;
                border-radius: 8px;
                background: rgba(108, 99, 255, 0.06);
                cursor: pointer;
                transition: background 0.2s;
                user-select: none;
            }
            .nav-item-header:hover {
                background: rgba(108, 99, 255, 0.12);
            }
            .nav-item-header input[type='checkbox'] {
                accent-color: var(--accent);
                width: 15px;
                height: 15px;
                cursor: pointer;
            }
            .nav-item-title {
                font-weight: 600;
                font-size: 13px;
            }
            .nav-item-link {
                color: var(--text-dim);
                font-size: 11px;
                font-family: 'Consolas', monospace;
                margin-left: auto;
            }
            .nav-children {
                margin-left: 34px;
                margin-top: 2px;
            }
            .nav-child {
                padding: 2px 0;
                font-size: 12px;
                color: #555;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .nav-child::before {
                content: '\251C';
                color: #ccc;
                font-family: monospace;
                font-size: 13px;
            }
            .nav-child:last-child::before {
                content: '\2514';
            }
            .nav-child input[type='checkbox'] {
                accent-color: var(--accent);
                width: 13px;
                height: 13px;
                cursor: pointer;
                margin: 0;
            }
            .nav-child-link {
                color: var(--text-dim);
                font-size: 10px;
                font-family: 'Consolas', monospace;
                margin-left: auto;
            }

            /* ── Contact fields ── */
            .contact-list {
                padding: 12px 16px;
                flex: 1;
                overflow-y: auto;
            }
            .contact-list:empty::before {
                content: '\2190  在左侧粘贴联系人信息，然后点击「提取联系人」';
                color: rgba(0, 0, 0, 0.25);
                font-size: 13px;
            }
            .contact-field {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 8px;
                padding: 8px 12px;
                border-radius: 8px;
                background: rgba(108, 99, 255, 0.06);
            }
            .contact-field label {
                font-weight: 600;
                font-size: 13px;
                min-width: 56px;
                color: var(--text);
            }
            .contact-field input {
                flex: 1;
                padding: 5px 10px;
                border: 1px solid var(--border);
                border-radius: 6px;
                font-size: 13px;
                outline: none;
                background: #fff;
                font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            }
            .contact-field input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-glow);
            }

            /* ── Output panel ── */
            .output-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-width: 0;
            }
            .output-header {
                padding: 10px 16px;
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 2px;
                color: var(--text-dim);
                border-bottom: 1px solid var(--border);
                background: rgba(0, 0, 0, 0.02);
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-shrink: 0;
            }
            .output-actions {
                display: flex;
                gap: 8px;
            }
            .output-body {
                flex: 1;
                overflow: hidden;
            }
            .output-area {
                width: 100%;
                height: 100%;
                padding: 16px;
                border: none;
                background: #fff;
                color: var(--text);
                font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
                font-size: 12px;
                line-height: 1.6;
                resize: none;
                outline: none;
            }
            .output-area::placeholder {
                color: rgba(0, 0, 0, 0.25);
            }

            /* ── Buttons ── */
            .btn {
                padding: 7px 16px;
                border: none;
                border-radius: 8px;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s ease;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                white-space: nowrap;
            }
            .btn-sm {
                padding: 5px 12px;
                font-size: 12px;
                border-radius: 6px;
            }
            .btn-primary {
                background: linear-gradient(135deg, var(--accent), #48c6ef);
                color: #fff;
                box-shadow: 0 3px 12px var(--accent-glow);
            }
            .btn-primary:hover {
                transform: translateY(-1px);
                box-shadow: 0 5px 20px var(--accent-glow);
            }
            .btn-secondary {
                background: var(--bg-card);
                color: var(--text);
                border: 1px solid var(--border);
            }
            .btn-secondary:hover {
                background: rgba(0, 0, 0, 0.06);
            }
            .btn-success {
                background: var(--success);
                color: #fff;
            }
            .btn-success:hover {
                background: #43a047;
            }

            /* ── Contact layout ── */
            .contact-row {
                display: flex;
                gap: 20px;
            }
            .contact-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                background: var(--bg-secondary);
                border-radius: 12px;
                border: 1px solid var(--border);
                overflow: hidden;
            }
            .contact-panel-header {
                padding: 10px 16px;
                font-size: 14px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                color: var(--text-dim);
                background: rgba(0, 0, 0, 0.02);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .contact-panel-footer {
                padding: 10px 16px;
                border-top: 1px solid var(--border);
                background: rgba(0, 0, 0, 0.02);
            }
            .contact-textarea {
                width: 100%;
                min-height: 120px;
                padding: 12px 16px;
                border: none;
                background: #fff;
                color: var(--text);
                font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
                font-size: 12px;
                line-height: 1.6;
                resize: vertical;
                outline: none;
            }
            .contact-textarea:focus {
                box-shadow: inset 0 0 0 2px var(--accent-glow);
            }
            .contact-textarea::placeholder {
                color: rgba(0, 0, 0, 0.25);
            }
            .contact-actions-bar {
                display: flex;
                gap: 10px;
                align-items: center;
                padding: 12px 20px;
                background: var(--bg-secondary);
                border-radius: 12px;
                border: 1px solid var(--border);
            }

            /* ── Format tab ── */
            .fmt-opt {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .fmt-opt label {
                font-size: 13px;
                color: var(--text-dim);
                cursor: pointer;
                user-select: none;
                white-space: nowrap;
            }
            .fmt-title-group {
                display: flex;
                align-items: center;
                gap: 8px;
                padding-right: 4px;
            }
            .fmt-segment-wrap {
                display: flex;
                align-items: center;
                gap: 5px;
                font-size: 12px;
                color: var(--text-dim);
                white-space: nowrap;
            }
            .fmt-segment {
                display: inline-flex;
                align-items: center;
                padding: 2px;
                border: 1px solid var(--border);
                border-radius: 7px;
                background: rgba(0, 0, 0, 0.03);
                transition: opacity 0.18s ease, background 0.18s ease;
            }
            .fmt-segment-btn {
                height: 28px;
                padding: 0 10px;
                border: 0;
                border-radius: 5px;
                background: transparent;
                color: var(--text-dim);
                font-size: 12px;
                outline: none;
                cursor: pointer;
                transition: color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
            }
            .fmt-segment-btn:hover {
                color: var(--text);
                background: rgba(108, 99, 255, 0.08);
            }
            .fmt-segment-btn.active {
                color: #fff;
                background: var(--accent);
                box-shadow: 0 2px 8px rgba(108, 99, 255, 0.22);
            }
            .fmt-title-group.disabled .fmt-segment {
                opacity: 0.45;
            }
            .fmt-title-group.disabled .fmt-segment-btn {
                cursor: not-allowed;
                pointer-events: none;
            }
            .toggle {
                position: relative;
                width: 40px;
                height: 22px;
                flex-shrink: 0;
                cursor: pointer;
            }
            .toggle input {
                position: absolute;
                width: 100%;
                height: 100%;
                opacity: 0;
                cursor: pointer;
                z-index: 2;
                margin: 0;
            }
            .toggle .slider {
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.12);
                border-radius: 11px;
                cursor: pointer;
                transition: 0.3s;
            }
            .toggle .slider::before {
                content: '';
                position: absolute;
                width: 16px;
                height: 16px;
                left: 3px;
                bottom: 3px;
                background: #fff;
                border-radius: 50%;
                transition: 0.3s;
            }
            .toggle input:checked + .slider {
                background: var(--accent);
                box-shadow: 0 0 8px var(--accent-glow);
            }
            .toggle input:checked + .slider::before {
                transform: translateX(18px);
            }
            .fmt-tab-group {
                display: flex;
                gap: 0;
            }
            .fmt-tab {
                padding: 4px 14px;
                font-size: 11px;
                letter-spacing: 1px;
                cursor: pointer;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--text-dim);
                transition: 0.2s;
                text-transform: uppercase;
            }
            .fmt-tab:first-child {
                border-radius: 6px 0 0 6px;
            }
            .fmt-tab:last-child {
                border-radius: 0 6px 6px 0;
            }
            .fmt-tab.active {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            .rich-input {
                width: 100%;
                height: 100%;
                padding: 16px;
                overflow-y: auto;
                outline: none;
                font-size: 14px;
                line-height: 1.8;
                color: var(--text);
                background: #fff;
            }
            .rich-input:empty::before {
                content: '在此粘贴富文本内容（Ctrl+V）...';
                color: rgba(0, 0, 0, 0.25);
            }
            .fmt-preview {
                width: 100%;
                height: 100%;
                padding: 16px;
                overflow-y: auto;
                font-size: 14px;
                line-height: 1.8;
                background: #fff;
                outline: none;
            }
            .fmt-preview:empty::before {
                content: '格式化后的内容将在此显示';
                color: rgba(0, 0, 0, 0.25);
            }
            .fmt-preview table {
                border-collapse: collapse;
                width: 100%;
                margin: 12px 0;
            }
            .fmt-preview td,
            .fmt-preview th {
                border: 1px solid rgba(0, 0, 0, 0.12);
                padding: 8px 12px;
                text-align: left;
            }
            .fmt-preview th {
                background: rgba(0, 0, 0, 0.04);
            }
            .fmt-preview p {
                margin: 8px 0;
            }
            .fmt-preview img {
                max-width: 100%;
            }
            .hidden {
                display: none !important;
            }

            /* ── Text Processing tab ── */
            .textproc-layout {
                max-width: 1440px;
                width: 100%;
                margin: 0 auto;
                display: grid;
                grid-template-columns: 300px minmax(0, 1fr);
                gap: 20px;
                flex: 1;
                min-height: 0;
            }
            .textproc-tools {
                display: flex;
                flex-direction: column;
                gap: 12px;
                min-height: 0;
                overflow-y: auto;
            }
            .textproc-tool-section {
                background: var(--bg-secondary);
                border: 1px solid var(--border);
                border-radius: 12px;
                overflow: hidden;
            }
            .textproc-tool-title {
                padding: 10px 14px;
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 1.2px;
                color: var(--text-dim);
                background: rgba(0, 0, 0, 0.02);
                border-bottom: 1px solid var(--border);
            }
            .textproc-tool-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                padding: 12px;
            }
            .textproc-tool-btn {
                min-height: 34px;
                padding: 7px 10px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: #fff;
                color: var(--text);
                font-size: 13px;
                cursor: pointer;
                transition: 0.2s;
                text-align: center;
            }
            .textproc-tool-btn:hover {
                border-color: rgba(108, 99, 255, 0.35);
                background: rgba(108, 99, 255, 0.06);
            }
            .textproc-tool-btn.active {
                border-color: var(--accent);
                background: linear-gradient(135deg, var(--accent), #48c6ef);
                color: #fff;
                box-shadow: 0 3px 12px var(--accent-glow);
            }
            .textproc-workspace {
                display: flex;
                flex-direction: column;
                gap: 12px;
                min-width: 0;
                min-height: 0;
            }
            .textproc-editor-grid {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 20px;
                flex: 1;
                min-height: 0;
            }
            .textproc-stats {
                margin-left: auto;
                display: flex;
                gap: 10px;
                color: var(--text-dim);
                font-size: 11px;
                font-weight: 500;
                letter-spacing: 0;
                text-transform: none;
            }
            .textproc-actions {
                justify-content: flex-end;
            }
            @media (max-width: 1100px) {
                .textproc-layout {
                    grid-template-columns: 1fr;
                }
                .textproc-tools {
                    max-height: 260px;
                }
            }
            @media (max-width: 760px) {
                .textproc-editor-grid {
                    grid-template-columns: 1fr;
                }
                .textproc-tool-grid {
                    grid-template-columns: 1fr;
                }
            }

            /* ── Modal ── */
            .modal-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.3);
                backdrop-filter: blur(4px);
                z-index: 200;
                align-items: center;
                justify-content: center;
            }
            .modal-overlay.show {
                display: flex;
            }
            .modal {
                background: #fff;
                border-radius: 14px;
                padding: 28px 32px;
                width: 380px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            }
            .modal-title {
                font-size: 17px;
                font-weight: 600;
                margin-bottom: 6px;
                color: var(--text);
            }
            .modal-desc {
                font-size: 13px;
                color: var(--text-dim);
                margin-bottom: 18px;
            }
            .modal-presets {
                display: flex;
                gap: 8px;
                margin-bottom: 14px;
                flex-wrap: wrap;
            }
            .preset-btn {
                padding: 6px 16px;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: var(--bg-card);
                color: var(--text);
                font-size: 13px;
                cursor: pointer;
                transition: 0.2s;
            }
            .preset-btn:hover {
                background: var(--accent);
                color: #fff;
                border-color: var(--accent);
            }
            .modal-input {
                width: 100%;
                padding: 10px 14px;
                border: 1px solid var(--border);
                border-radius: 8px;
                font-size: 14px;
                outline: none;
                background: var(--bg-primary);
                color: var(--text);
                margin-bottom: 18px;
            }
            .modal-input:focus {
                border-color: var(--accent);
            }
            .modal-actions {
                display: flex;
                justify-content: flex-end;
                gap: 10px;
            }
            .replace-preview-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
                margin-bottom: 16px;
            }
            .replace-preview-table th {
                text-align: left;
                padding: 8px 10px;
                background: rgba(0, 0, 0, 0.03);
                border-bottom: 2px solid var(--border);
                font-weight: 600;
                color: var(--text-dim);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            .replace-preview-table td {
                padding: 8px 10px;
                border-bottom: 1px solid var(--border);
                vertical-align: middle;
            }
            .replace-preview-table tr:last-child td {
                border-bottom: none;
            }
            .replace-preview-table .original-text {
                font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
                font-size: 12px;
                color: #666;
                max-width: 200px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .replace-preview-table select {
                padding: 4px 8px;
                border: 1px solid var(--border);
                border-radius: 6px;
                font-size: 12px;
                background: #fff;
                color: var(--text);
                cursor: pointer;
                outline: none;
            }
            .replace-preview-table select:focus {
                border-color: var(--accent);
            }
            .replace-preview-table .new-value {
                font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
                font-size: 12px;
                color: var(--accent);
                font-weight: 500;
            }

            /* ── Forbidden Words ── */
            .fw-add-row {
                display: flex;
                gap: 8px;
                margin-bottom: 16px;
                align-items: center;
            }
            .fw-add-row input {
                flex: 1;
                padding: 8px 12px;
                border: 1px solid var(--border);
                border-radius: 6px;
                font-size: 13px;
                outline: none;
                background: var(--bg-primary);
            }
            .fw-add-row input:focus {
                border-color: var(--accent);
            }
            .fw-list {
                max-height: 320px;
                overflow-y: auto;
                margin-bottom: 12px;
            }
            .fw-list table {
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
            }
            .fw-list th {
                text-align: left;
                padding: 8px 10px;
                background: rgba(0, 0, 0, 0.03);
                border-bottom: 2px solid var(--border);
                font-weight: 600;
                color: var(--text-dim);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            .fw-list td {
                padding: 7px 10px;
                border-bottom: 1px solid var(--border);
                vertical-align: middle;
            }
            .fw-list tr:last-child td {
                border-bottom: none;
            }
            .fw-list .fw-word {
                font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
                font-size: 12px;
                color: #e74c3c;
            }
            .fw-list .fw-replacement {
                font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
                font-size: 12px;
                color: var(--accent);
            }
            .fw-list .fw-del {
                background: none;
                border: none;
                color: #ccc;
                cursor: pointer;
                font-size: 16px;
                padding: 2px 6px;
                border-radius: 4px;
                transition: 0.2s;
            }
            .fw-list .fw-del:hover {
                color: var(--danger);
                background: rgba(231, 76, 60, 0.08);
            }
            .fw-empty {
                text-align: center;
                padding: 24px;
                color: var(--text-dim);
                font-size: 13px;
            }

            /* ── Toast ── */
            .toast {
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%) translateY(100px);
                padding: 12px 28px;
                background: var(--success);
                color: #fff;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                box-shadow: 0 8px 30px rgba(76, 175, 80, 0.3);
                transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 999;
            }
            .toast.show {
                transform: translateX(-50%) translateY(0);
            }
            .toast.error {
                background: var(--danger);
                box-shadow: 0 8px 30px rgba(231, 76, 60, 0.3);
            }

            /* ── Scrollbar ── */
            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: rgba(0, 0, 0, 0.12);
                border-radius: 3px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: rgba(0, 0, 0, 0.22);
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>建站工具箱</h1>
            <div class="tab-group">
                <button class="tab-btn active" data-tab="format" onclick="switchTab('format')">HTML格式化</button>
                <button class="tab-btn" data-tab="nav" onclick="switchTab('nav')">导航填充</button>

        <!-- ==================== Nav Tab ==================== -->

                        <textarea
                            id="sourceInput"

                            style="flex: 1"
                            placeholder="粘贴导航 HTML 代码（含 .itemNav / .navchildlist 结构）..."

                    </div>
                    <div class="contact-panel" style="min-height: 0">
                        <div class="contact-panel-header">
                            提取结果
                            <span class="badge" id="navCount" style="display: none">0</span>
                        </div>
                        <div class="nav-tree" id="navTree"></div>
                    </div>
                </div>

                <!-- 下半部分：目标模板代码 + 生成结果 -->
                <div class="contact-row" style="flex: 1; min-height: 0">
                    <div class="contact-panel" style="flex: 1; min-height: 0">
                        <div class="contact-panel-header">目标模板代码</div>
                        <textarea
                            id="templateInput"
                            class="contact-textarea"
                            style="flex: 1"
                            placeholder="粘贴目标模板 HTML 代码（含重复块结构，至少 2 个同类块）..."
                        ></textarea>
                    </div>
                    <div class="contact-panel" style="flex: 1; min-height: 0">
                        <div class="contact-panel-header">生成结果</div>
                        <textarea id="outputArea" class="contact-textarea" style="flex: 1" placeholder="点击「生成代码」查看结果..."></textarea>
                    </div>
                </div>

                <!-- 底部按钮栏 -->
                <div class="contact-actions-bar">
                    <button class="btn btn-success" onclick="generateOutput()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14" />
                            <path d="M5 12h14" />
                        </svg>
                        生成代码
                    </button>
                    <button class="btn btn-secondary" onclick="copyOutput()">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" />
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                        </svg>
                        复制结果
                    </button>
                    <button class="btn btn-secondary" onclick="clearAll()" style="margin-left: auto">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18" />
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>
                        清除全部
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================== Contact Tab ==================== -->
        <div class="main" id="contactPage" style="flex-direction: column; overflow-y: auto; padding: 24px 48px">
            <div style="max-width: 1440px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; flex: 1; min-height: 0">
                <!-- 上半部分：联系人输入 + 提取结果 -->
                <div class="contact-row">
                    <div class="contact-panel">
                        <div class="contact-panel-header">联系人信息</div>
                        <textarea
                            id="contactInput"
                            class="contact-textarea"
                            style="flex: 1"
                            placeholder="粘贴联系人信息文本...&#10;&#10;示例格式：&#10;联系人：夏生&#10;联系电话：13922514971&#10;电子邮箱：13662908226@163.com&#10;公司地址：东莞市樟木头镇圩镇泰安路190号101室"
                        ></textarea>
                    </div>
                    <div class="contact-panel">
                        <div class="contact-panel-header">
                            提取结果
                            <span class="badge" id="contactCount" style="display: none">0</span>
                        </div>
                        <div class="contact-list" id="contactList"></div>
                    </div>
                </div>

                <!-- 下半部分：HTML代码输入 + 替换结果输出 -->
                <div class="contact-row" style="flex: 1; min-height: 0">
                    <div class="contact-panel" style="flex: 1; min-height: 0">
                        <div class="contact-panel-header">联系方式代码</div>
                        <textarea
                            id="contactCodeInput"
                            class="contact-textarea"
                            style="flex: 1"
                            placeholder="粘贴包含联系方式的 HTML 代码块..."
                        ></textarea>
                    </div>
                    <div class="contact-panel" style="flex: 1; min-height: 0">
                        <div class="contact-panel-header">替换结果</div>
                        <textarea id="contactOutput" class="contact-textarea" style="flex: 1" placeholder="点击「替换」查看结果..."></textarea>
                    </div>
                </div>

                <!-- 底部按钮栏 -->
                <div class="contact-actions-bar">
                    <button class="btn btn-success" onclick="replaceContact()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 1l4 4-4 4" />
                            <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                            <path d="M7 23l-4-4 4-4" />
                            <path d="M21 13v2a4 4 0 0 1-4 4H3" />
                        </svg>
                        替换
                    </button>
                    <button class="btn btn-secondary" onclick="copyContactOutput()">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" />
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                        </svg>
                        复制结果
                    </button>
                    <button class="btn btn-secondary" onclick="clearContact()" style="margin-left: auto">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18" />
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>
                        清除全部
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================== Text Processing Tab ==================== -->
        <div class="main" id="textprocPage" style="flex-direction: column; overflow-y: auto; padding: 24px 48px">
            <div class="textproc-layout">
                <div class="textproc-tools">
                    <div class="textproc-tool-section">
                        <div class="textproc-tool-title">清洗整理</div>
                        <div class="textproc-tool-grid">
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'trimSpaces')">去首尾空格</button>
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'collapseSpaces')">合并空格</button>
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'removeSpaces')">删除空格</button>
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'trimEmpty')">去空行</button>
                        </div>
                    </div>
                    <div class="textproc-tool-section">
                        <div class="textproc-tool-title">大小写</div>
                        <div class="textproc-tool-grid">
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'upper')">全大写</button>
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'lower')">全小写</button>
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'capitalize')">首字母大写</button>
                        </div>
                    </div>
                    <div class="textproc-tool-section">
                        <div class="textproc-tool-title">标点转换</div>
                        <div class="textproc-tool-grid">
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'cn2en')">中文转英文</button>
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'en2cn')">英文转中文</button>
                        </div>
                    </div>
                    <div class="textproc-tool-section">
                        <div class="textproc-tool-title">行处理</div>
                        <div class="textproc-tool-grid">
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'keepSingleBreak')">单换行</button>
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'removeBreaks')">合并为一行</button>
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'lineUnique')">按行去重</button>
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'lineSort')">按行排序</button>
                            <button class="textproc-tool-btn" onclick="runTextprocTool(this, 'lineNumber')">每行编号</button>
                        </div>
                    </div>
                </div>

                <div class="textproc-workspace">
                    <div class="textproc-editor-grid">
                        <div class="contact-panel" style="min-height: 0">
                            <div class="contact-panel-header">
                                源文本
                                <div class="textproc-stats" id="textprocInputStats">
                                    <span>0 字</span>
                                    <span>0 行</span>
                                </div>
                            </div>
                            <textarea
                                id="textprocInput"
                                class="contact-textarea"
                                style="flex: 1"
                                placeholder="粘贴需要处理的纯文本..."
                                oninput="updateTextprocStats()"
                            ></textarea>
                        </div>
                        <div class="contact-panel" style="min-height: 0">
                            <div class="contact-panel-header">
                                处理结果
                                <div class="textproc-stats" id="textprocOutputStats">
                                    <span>0 字</span>
                                    <span>0 行</span>
                                </div>
                            </div>
                            <textarea
                                id="textprocOutput"
                                class="contact-textarea"
                                style="flex: 1"
                                readonly
                                placeholder="选择左侧工具后，处理结果将在此显示..."
                            ></textarea>
                        </div>
                    </div>

                    <div class="contact-actions-bar textproc-actions">
                        <button class="btn btn-secondary btn-sm" onclick="useTextprocOutputAsInput()">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 12h18" />
                                <path d="M10 5l7 7-7 7" />
                            </svg>
                            结果回填
                        </button>
                        <button class="btn btn-primary btn-sm" onclick="copyTextprocOutput()">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" />
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                            </svg>
                            复制结果
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="clearTextproc()">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 6h18" />
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                            </svg>
                            清空
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== Format Tab ==================== -->
        <div class="main active" id="formatPage" style="flex-direction: column; overflow-y: auto; padding: 24px 48px">
            <div style="max-width: 1440px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0">
                <!-- 选项栏 -->
                <div class="contact-actions-bar" style="flex-wrap: wrap; gap: 16px">
                    <div class="fmt-opt">
                        <div class="toggle">
                            <input type="checkbox" id="optRemoveStyle" checked />
                            <span class="slider"></span>
                        </div>
                        <label for="optRemoveStyle">去除行内样式</label>
                    </div>
                    <div class="fmt-title-group">
                        <div class="fmt-opt">
                            <div class="toggle">
                                <input type="checkbox" id="optAutoTitle" checked onchange="syncTitleOptions()" />
                                <span class="slider"></span>
                            </div>
                            <label for="optAutoTitle">小标题识别</label>
                        </div>
                        <div class="fmt-segment-wrap">
                            <span>规则</span>
                            <div class="fmt-segment" data-title-group="rule">
                                <button class="fmt-segment-btn active" type="button" data-value="general" onclick="setTitleOption('rule', 'general')">通用</button>
                                <button class="fmt-segment-btn" type="button" data-value="english" onclick="setTitleOption('rule', 'english')">英文</button>
                            </div>
                            <input type="hidden" id="titleDetectRule" value="general" />
                        </div>
                        <div class="fmt-segment-wrap">
                            <span>输出</span>
                            <div class="fmt-segment" data-title-group="output">
                                <button class="fmt-segment-btn active" type="button" data-value="bold" onclick="setTitleOption('output', 'bold')">加粗</button>
                                <button class="fmt-segment-btn" type="button" data-value="h3" onclick="setTitleOption('output', 'h3')">H3</button>
                            </div>
                            <input type="hidden" id="titleOutputMode" value="bold" />
                        </div>
                    </div>
                    <div class="fmt-opt">
                        <div class="toggle">
                            <input type="checkbox" id="optIndent" checked />
                            <span class="slider"></span>
                        </div>
                        <label for="optIndent">段落首行缩进</label>
                    </div>
                    <div class="fmt-opt">
                        <div class="toggle">
                            <input type="checkbox" id="optKeepBold" checked />
                            <span class="slider"></span>
                        </div>
                        <label for="optKeepBold">保留原有粗体</label>
                    </div>
                    <div class="fmt-opt">
                        <div class="toggle">
                            <input type="checkbox" id="optRemoveImg" />
                            <span class="slider"></span>
                        </div>
                        <label for="optRemoveImg">去除图片</label>
                    </div>
                    <button class="btn btn-secondary btn-sm" id="imgWidthBtn" onclick="showImgWidthDialog()">

                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <circle cx="8.5" cy="8.5" r="1.5" />
                            <path d="M21 15l-5-5L5 21" />
                        </svg>
                        <span id="imgWidthBtnText">图片宽度：未设置</span>
                    </button>
                    <div class="fmt-opt">
                        <div class="toggle">
                            <input type="checkbox" id="optForbiddenWords" />
                            <span class="slider"></span>
                        </div>
                        <label for="optForbiddenWords">禁词替换</label>
                    </div>
                    <button class="btn btn-secondary btn-sm" onclick="showForbiddenWordsModal()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M4.93 4.93l14.14 14.14" />
                        </svg>
                        <span>禁词库</span>
                        <span class="badge" id="fwBadge" style="display: none; font-size: 10px; padding: 1px 6px">0</span>
                    </button>
                </div>

                <!-- 输入 + 输出 左右对照 -->
                <div class="contact-row" style="flex: 1; min-height: 0">
                    <div class="contact-panel" style="flex: 1; min-height: 0">
                        <div class="contact-panel-header">
                            <span>输入</span>
                            <div class="fmt-tab-group">
                                <div class="fmt-tab active" onclick="switchFormatInputTab('rich')">富文本</div>
                                <div class="fmt-tab" onclick="switchFormatInputTab('code')">源代码</div>
                            </div>
                        </div>
                        <div style="flex: 1; overflow: hidden; position: relative">
                            <div class="rich-input" id="richInput" contenteditable="true"></div>
                            <textarea
                                class="contact-textarea hidden"
                                id="codeInput"
                                style="position: absolute; inset: 0; height: 100%"
                                placeholder="在此粘贴 HTML 源代码..."
                                spellcheck="false"
                            ></textarea>
                        </div>
                    </div>
                    <div class="contact-panel" style="flex: 1; min-height: 0">
                        <div class="contact-panel-header">
                            <span>输出</span>
                            <div class="fmt-tab-group">
                                <div class="fmt-tab active" onclick="switchFormatOutputTab('preview')">预览</div>
                                <div class="fmt-tab" onclick="switchFormatOutputTab('source')">源代码</div>
                            </div>
                            <div style="margin-left: auto; display: flex; align-items: center; gap: 4px">
                                <button
                                    class="btn btn-secondary btn-sm"
                                    onclick="toggleFindReplace()"
                                    title="查找替换"
                                    style="padding: 3px 8px; font-size: 12px"
                                >
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="11" cy="11" r="8" />
                                        <path d="M21 21l-4.35-4.35" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div
                            id="findReplaceBar"
                            style="
                                display: none;
                                padding: 6px 12px;
                                border-bottom: 1px solid var(--border);
                                background: rgba(0, 0, 0, 0.02);
                                flex-shrink: 0;
                            "
                        >
                            <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap">
                                <input
                                    id="findInput"
                                    placeholder="查找..."
                                    style="
                                        flex: 1;
                                        min-width: 120px;
                                        padding: 4px 8px;
                                        border: 1px solid var(--border);
                                        border-radius: 4px;
                                        font-size: 12px;
                                        outline: none;
                                        background: #fff;
                                    "
                                />
                                <input
                                    id="replaceInput"
                                    placeholder="替换为..."
                                    style="
                                        flex: 1;
                                        min-width: 120px;
                                        padding: 4px 8px;
                                        border: 1px solid var(--border);
                                        border-radius: 4px;
                                        font-size: 12px;
                                        outline: none;
                                        background: #fff;
                                    "
                                />
                                <span id="findCount" style="font-size: 11px; color: var(--text-dim); white-space: nowrap"></span>
                                <button class="btn btn-secondary btn-sm" onclick="findNext()" style="padding: 3px 8px; font-size: 11px">
                                    下一个
                                </button>
                                <button class="btn btn-secondary btn-sm" onclick="replaceOne()" style="padding: 3px 8px; font-size: 11px">
                                    替换
                                </button>
                                <button class="btn btn-secondary btn-sm" onclick="replaceAllMatches()" style="padding: 3px 8px; font-size: 11px">
                                    全部替换
                                </button>
                            </div>
                        </div>
                        <div style="flex: 1; overflow: hidden; position: relative">
                            <div class="fmt-preview" id="fmtPreview" contenteditable="true"></div>
                            <textarea
                                class="contact-textarea hidden"
                                id="fmtOutputSource"
                                style="position: absolute; inset: 0; height: 100%"
                                spellcheck="false"
                            ></textarea>
                        </div>
                    </div>
                </div>

                <!-- 底部按钮栏 -->
